# Include these locations inside the existing `server` block for subit.org.cn.

location = /content/current.json {
    alias /var/lib/subit-website-content/public/current.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=30, stale-while-revalidate=300" always;
}

location = /content/site-content.json {
    alias /var/lib/subit-website-content/public/site-content.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=30, stale-while-revalidate=300" always;
}

location ^~ /content/releases/ {
    alias /var/lib/subit-website-content/public/releases/;
    default_type application/json;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /content/assets/ {
    alias /var/lib/subit-website-content/public/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /content-api/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 9m;
}
